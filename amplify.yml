version: 1
frontend:
  phases:
    preBuild:
      commands:
        - rm -rf .agents ai_models/logs scripts/tools
        - npm ci
        - npx prisma generate
        - rm -rf node_modules/ffmpeg-static
    build:
      commands:
        - env | grep -e DATABASE_URL -e SIGAP_ -e SAP_ -e INTERNAL_API_KEY -e EDGE_CAMERA_API_KEY >> .env.production
        - echo "AWS_ACCESS_KEY_ID=$SIGAP_AWS_ACCESS_KEY_ID" >> .env.production
        - echo "AWS_SECRET_ACCESS_KEY=$SIGAP_AWS_SECRET_ACCESS_KEY" >> .env.production
        - echo "AWS_REGION=${SIGAP_AWS_REGION:-us-east-1}" >> .env.production
        - echo "AWS_BEDROCK_MODEL_ID=${SIGAP_BEDROCK_MODEL_ID:-amazon.nova-lite-v1:0}" >> .env.production
        - echo "AWS_S3_BUCKET_NAME=${SIGAP_S3_BUCKET_NAME:-sigap-inspection-frames}" >> .env.production
        - echo "AWS_S3_REGION=${SIGAP_S3_REGION:-ap-southeast-2}" >> .env.production
        - npm run build
    postBuild:
      commands:
        - rm -rf .next/cache .next/standalone
        - rm -rf node_modules/ffmpeg-static node_modules/prisma node_modules/typescript node_modules/@types
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
    exclude:
      - 'cache/**/*'
  cache:
    paths:
      - node_modules/**/*
